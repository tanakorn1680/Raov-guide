[versions]
agp          = "8.3.2"
kotlin       = "1.9.23"
coreKtx      = "1.13.1"
appcompat    = "1.7.0"
material     = "1.12.0"
recyclerview = "1.3.2"
cardview     = "1.0.0"
localbroadcastmanager = "1.1.0"
coroutines   = "1.7.3"
mlkitTextRecognition = "16.0.1"
mlkitTextRecognitionThai = "16.0.1"

[libraries]
androidx-core-ktx        = { group = "androidx.core",           name = "core-ktx",                 version.ref = "coreKtx" }
androidx-appcompat        = { group = "androidx.appcompat",      name = "appcompat",                version.ref = "appcompat" }
material                  = { group = "com.google.android.material", name = "material",             version.ref = "material" }
androidx-recyclerview     = { group = "androidx.recyclerview",   name = "recyclerview",             version.ref = "recyclerview" }
androidx-cardview         = { group = "androidx.cardview",       name = "cardview",                 version.ref = "cardview" }
androidx-localbroadcastmanager = { group = "androidx.localbroadcastmanager", name = "localbroadcastmanager", version.ref = "localbroadcastmanager" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
mlkit-text-recognition    = { group = "com.google.mlkit",       name = "text-recognition",         version.ref = "mlkitTextRecognition" }
mlkit-text-recognition-thai = { group = "com.google.mlkit",     name = "text-recognition-thai",    version.ref = "mlkitTextRecognitionThai" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
