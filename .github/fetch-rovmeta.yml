name: Fetch RoV Meta raw HTML

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "จำนวนหน้าที่จะดึง (0 = ทั้งหมด, ใส่ 3 เพื่อลองก่อน)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch hero pages (polite, one at a time)
        env:
          LIMIT: ${{ inputs.limit }}
        run: python tools/fetch_rovmeta.py --limit "${LIMIT:-0}" --out out

      # อัปโหลดโฟลเดอร์ ไม่ใช่ zip ซ้อน zip: ไฟล์ที่โหลดจากหน้า Actions จะเป็น zip เดียวที่มี HTML ทั้งหมด
      - name: Upload raw HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rovmeta-raw
          path: out/rovmeta_raw/
          retention-days: 14
          if-no-files-found: warn
