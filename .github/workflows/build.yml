name: Build ProMenu (arm64)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ImGui and AML headers
        run: bash setup.sh

      - name: Build with ndk-build
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          echo "Using NDK: $NDK"
          "$NDK/ndk-build" -j"$(nproc)" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: libProMenu64
          path: libs/arm64-v8a/libProMenu64.so
