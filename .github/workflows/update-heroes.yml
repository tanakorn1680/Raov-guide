              "d-arcy": ["DArcy", "D Arcy"],
          }

          # ชื่อที่แสดงในเกม
          DISPLAY_NAMES = {
              "y-bneth": "Y'bneth",
              "eland-orr": "Eland'orr",
              "tel-annas": "Tel'Annas",
              "azzen-ka": "Azzen'Ka",
              "lu-bu": "Lu Bu",
              "wonder-woman": "Wonder Woman",
              "kil-groth": "Kil'Groth",
              "diao-chan": "Diao Chan",
              "bolt-baron": "Bolt Baron",
              "the-flash": "The Flash",
              "d-arcy": "D'Arcy",
          }

          def fetch_hero(hero_id):
              url = f"https://rovmeta.com/th/heroes/{hero_id}"
              try:
                  r = requests.get(url, headers=HEADERS, timeout=15)
                  if r.status_code != 200:
                      print(f"  ❌ {hero_id}: HTTP {r.status_code}")
                      return None
                  soup = BeautifulSoup(r.text, 'html.parser')
                  text = r.text

                  # ดึง counters (กลัวเจอ) และ strong_against (แข็งใส่)
                  counters = []
                  strong_against = []
                  synergies = []

                  # หา sections ด้วย heading
                  sections = re.split(r'<h[23][^>]*>', text)
                  for i, section in enumerate(sections):
                      section_lower = section.lower()
                      heroes_in_section = re.findall(r'/heroes/([a-z0-9\-]+)"', section)
                      heroes_in_section = [h for h in heroes_in_section if h in HERO_IDS]

                      if 'กลัวเจอ' in section_lower or 'counter' in section_lower:
                          counters = heroes_in_section[:5]
                      elif 'แข็งใส่' in section_lower or 'strong' in section_lower:
                          strong_against = heroes_in_section[:6]
                      elif 'เข้าขา' in section_lower or 'synerg' in section_lower:
                          synergies = heroes_in_section[:4]

                  # ดึง skills
                  skills = []
                  skill_sections = re.finditer(
                      r'(PASSIVE|SKILL\s*\d|ULTIMATE)[^<]*</[^>]+>\s*<[^>]+>([^<]+)</[^>]+>([\s\S]+?)(?=PASSIVE|SKILL\s*\d|ULTIMATE|$)',
                      text, re.IGNORECASE
                  )
                  for m in skill_sections:
                      skill_type = m.group(1).strip()
                      skill_name = re.sub(r'<[^>]+>', '', m.group(2)).strip()
                      skill_desc_raw = re.sub(r'<[^>]+>', ' ', m.group(3))
                      skill_desc = re.sub(r'\s+', ' ', skill_desc_raw).strip()[:400]
                      if skill_name:
                          skills.append({
                              "type": skill_type,
                              "name": skill_name,
                              "desc": skill_desc
                          })

                  # ดึง recommended items
                  items = re.findall(r'"name"\s*:\s*"([^"]+)"', text)
                  items = list(dict.fromkeys(items))[:6]  # unique, max 6

                  print(f"  ✅ {hero_id}: counters={len(counters)} strong={len(strong_against)} syn={len(synergies)} skills={len(skills)}")
                  return {
                      "counters": counters,
                      "strong_against": strong_against,
                      "synergies": synergies,
                      "skills": skills,
                      "items": items
                  }
              except Exception as e:
                  print(f"  ❌ {hero_id}: {e}")
                  return None

          print("=== Fetching hero data from rovmeta.com ===")
          heroes_out = []
          failed = []

          for hero_id in HERO_IDS:
              meta = META.get(hero_id, {})
              display_name = DISPLAY_NAMES.get(hero_id, hero_id.replace('-', ' ').title())
              aliases = ALIASES.get(hero_id, [])

              details = fetch_hero(hero_id)
              time.sleep(0.5)

              hero_obj = {
                  "id": hero_id,
                  "name": display_name,
                  "aliases": aliases,
                  "role": meta.get("role", "UNKNOWN"),
                  "lanes": meta.get("lanes", []),
                  "damage": meta.get("damage", "PHYSICAL"),
                  "tags": meta.get("tags", []),
                  "tier": meta.get("tier", "B"),
                  "counters": details["counters"] if details else [],
                  "strong_against": details["strong_against"] if details else [],
                  "synergies": details["synergies"] if details else [],
                  "skills": details["skills"] if details else [],
                  "items": details["items"] if details else []
              }
              heroes_out.append(hero_obj)

          output = {
              "version": 3,
              "updated": "auto-updated by GitHub Actions",
              "source": "rovmeta.com",
              "total": len(heroes_out),
              "heroes": heroes_out
          }

          with open('app/src/main/assets/heroes.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"\n=== Done: {len(heroes_out)} heroes saved to heroes.json ===")
          if failed:
              print(f"Failed: {failed}")
          PYEOF

      - name: Commit and push heroes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/heroes.json
          git diff --staged --quiet || git commit -m "chore: update heroes.json from rovmeta.com [$(date +'%Y-%m-%d')]"
          git push
